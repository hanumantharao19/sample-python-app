
name: Docker CI - Amazon ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: devops-demo-app
  ECR_REGISTRY: 967427981562.dkr.ecr.us-east-1.amazonaws.com

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Debug OIDC Claims
        shell: bash
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')

          TOKEN="$TOKEN" python -c '
          import os, json, base64
          p = os.environ["TOKEN"].split(".")[1]
          p += "=" * ((4 - len(p) % 4) % 4)
          claims = json.loads(base64.urlsafe_b64decode(p))
          print("SUB:", claims.get("sub"))
          print("AUD:", claims.get("aud"))
          '


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            967427981562.dkr.ecr.us-east-1.amazonaws.com/devops-demo-app:latest
            967427981562.dkr.ecr.us-east-1.amazonaws.com/devops-demo-app:${{ github.sha }}

